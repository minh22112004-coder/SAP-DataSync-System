name: sap-datasync

services:
  volume-permissions:
    build:
      context: .
      dockerfile: docker/volume-permissions.Dockerfile
    network_mode: none
    volumes:
      - uploads_data:/data/uploads
      - archive_data:/data/archive
      - app_keys:/keys
    restart: "no"

  web-api:
    build:
      context: .
      dockerfile: docker/webapi.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=${SQL_HOST:-host.docker.internal},${SQL_PORT:-1433};Database=master;User ID=${SQL_USER:-sa};Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};Encrypt=${SQL_ENCRYPT:-true};TrustServerCertificate=${SQL_TRUST_SERVER_CERTIFICATE:-true};Connect Timeout=${SQL_CONNECT_TIMEOUT_SECONDS:-5}"
      Database__Initialize: "true"
      Database__SchemaScriptsPath: database/scripts
      Database__MaxAttempts: ${SQL_STARTUP_MAX_ATTEMPTS:-30}
      Database__RetryDelaySeconds: ${SQL_STARTUP_RETRY_DELAY_SECONDS:-2}
      EtlWorker__BaseUrl: http://etl-worker:${ETL_CONTROL_PORT:-8090}
      Uploads__Enabled: ${WEB_UPLOAD_ENABLED:-false}
      Uploads__Path: /data/uploads
      Uploads__MaxBytes: ${WEB_UPLOAD_MAX_BYTES:-104857600}
      AI__Enabled: ${AI_ENABLED:-false}
      AI__Provider: ${AI_PROVIDER:-Groq}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Model: ${AI_MODEL:-llama-3.3-70b-versatile}
      AI__BaseUrl: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI__MaxRecords: ${AI_MAX_RECORDS:-50}
      AI__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-30}
      AI__RequestsPerMinute: ${AI_REQUESTS_PER_MINUTE:-5}
      Security__DataProtectionKeysPath: /keys
    volumes:
      - uploads_data:/data/uploads
      - app_keys:/keys
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - backend
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  etl-worker:
    build:
      context: .
      dockerfile: docker/etl-worker.Dockerfile
    environment:
      SQL_HOST: ${SQL_HOST:-host.docker.internal}
      SQL_PORT: ${SQL_PORT:-1433}
      SQL_DATABASE: ${SQL_DATABASE:-SapDataSync}
      SQL_USER: ${SQL_USER:-sa}
      SQL_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      SQL_DRIVER: ODBC Driver 18 for SQL Server
      SQL_ENCRYPT: ${SQL_ENCRYPT:-true}
      SQL_TRUST_SERVER_CERTIFICATE: ${SQL_TRUST_SERVER_CERTIFICATE:-true}
      SQL_CONNECT_TIMEOUT_SECONDS: ${SQL_CONNECT_TIMEOUT_SECONDS:-5}
      SAP_SOURCE_PATH: /data/source
      SAP_UPLOAD_PATH: /data/uploads
      SAP_ARCHIVE_PATH: /data/archive
      SAP_FILE_PATTERN: ${SAP_FILE_PATTERN:-export*.xlsx}
      SAP_WORKSHEET_NAME: ${SAP_WORKSHEET_NAME:-}
      SAP_PRODUCT: ${SAP_PRODUCT:-12}
      SAP_SALES_ORGANIZATION: ${SAP_SALES_ORGANIZATION:-SG50}
      ETL_DAILY_TIME: ${ETL_DAILY_TIME:-01:00}
      ETL_TIMEZONE: ${ETL_TIMEZONE:-Asia/Ho_Chi_Minh}
      ETL_MIN_FILE_AGE_SECONDS: ${ETL_MIN_FILE_AGE_SECONDS:-10}
      ETL_ENABLE_SOFT_DELETE: ${ETL_ENABLE_SOFT_DELETE:-false}
      ETL_BATCH_SIZE: ${ETL_BATCH_SIZE:-500}
      ETL_RUN_ON_STARTUP: ${ETL_RUN_ON_STARTUP:-false}
      ETL_RUN_ONCE: "false"
      ETL_CONTROL_PORT: ${ETL_CONTROL_PORT:-8090}
    volumes:
      - type: bind
        source: ${SAP_SOURCE_PATH:-./data/source}
        target: /data/source
        read_only: true
      - archive_data:/data/archive
      - uploads_data:/data/uploads:ro
    networks:
      - backend
    expose:
      - "${ETL_CONTROL_PORT:-8090}"
    depends_on:
      web-api:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${ETL_CONTROL_PORT:-8090}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  uploads_data:
  archive_data:
  app_keys:
